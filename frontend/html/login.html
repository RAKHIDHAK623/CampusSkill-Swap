<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusSkillSwap</title>

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo-section">
            <div class="logo">CS</div>

            <h1>CampusSkillSwap</h1>

            <p>Learn. Teach. Exchange Skills.</p>
        </div>


        <div class="form-section">

            <h2>Welcome Back 👋</h2>

            <p class="subtitle">
                Login to your campus account
            </p>


            <form id="loginForm">

                <div class="input-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('loginPassword', this)"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="auth-button"
                    id="loginButton"
                >
                    Login
                </button>

            </form>


            <div id="loginMessage" class="message"></div>


            <p class="switch-page">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>

</div>

    import { initializeApp } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth
    } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCEQFQE5C47d-2iy3hgcMbPPMwoGFtdNbA",
        authDomain: "campusskillswap-b7a5d.firebaseapp.com",
        projectId: "campusskillswap-b7a5d",
        storageBucket: "campusskillswap-b7a5d.firebasestorage.app",
        messagingSenderId: "729251992860",
        appId: "1:729251992860:web:999c8d6a71058f897b96d9",
        measurementId: "G-DFKTCZPCJE"
    };

    const app = initializeApp(firebaseConfig);

    window.firebaseAuth = getAuth(app);

    console.log("Firebase initialized successfully");
</script>

<script type="module" src="../js/firebase-config.js"></script>
<script type="module" src="../js/auth.js"></script>

</body>
</html>
