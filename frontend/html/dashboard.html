<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard | CampusSkillSwap</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fb;
        }

        nav {
            height: 70px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;
        }

        nav h2 {
            margin: 0;
        }

        .logout {
            border: none;

            background: white;

            color: #4f46e5;

            padding:
                10px
                18px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;
        }

        .container {
            max-width: 1100px;

            margin: 50px auto;

            padding: 20px;
        }

        .welcome {
            background: white;

            padding: 30px;

            border-radius: 16px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.08);
        }

        .welcome h1 {
            color: #1f2937;
        }

        .welcome p {
            color: #6b7280;
        }

    </style>

</head>


<body>

<nav>

    <h2>
        CampusSkillSwap
    </h2>

    <button
        class="logout"
        onclick="logout()"
    >
        Logout
    </button>

</nav>


<div class="container">

    <div class="welcome">

        <h1>
            Welcome to CampusSkillSwap 🎓
        </h1>

        <p id="userEmail"></p>

        <p>
            Your dashboard is ready.
            Skills and Exchange features
            will be connected next.
        </p>

    </div>

</div>


<script>

    // Protect dashboard

    const token =
        localStorage.getItem("token");


    if (!token) {

        window.location.href =
            "login.html";
    }


    const email =
        localStorage.getItem(
            "userEmail"
        );


    document.getElementById(
        "userEmail"
    ).textContent =
        email
        ? "Logged in as: " + email
        : "";


    function logout() {

        localStorage.removeItem(
            "token"
        );

        localStorage.removeItem(
            "userEmail"
        );

        window.location.href =
            "login.html";
    }

</script>

</body>

</html>
